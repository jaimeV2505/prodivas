# Despliegue local:  docker compose up --build   →  http://localhost:3100 (cambia WEB_PORT en .env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodiva
      POSTGRES_PASSWORD: prodiva
      POSTGRES_DB: prodiva
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # para `npm run dev` fuera de Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodiva -d prodiva"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://prodiva:prodiva@db:5432/prodiva
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiame}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Europe/Madrid}
      MIN_NOTICE_MIN: ${MIN_NOTICE_MIN:-120}
      MAX_DAYS_AHEAD: ${MAX_DAYS_AHEAD:-60}
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
      CANCEL_NOTICE_HOURS: ${CANCEL_NOTICE_HOURS:-24}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-34670424348}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3100}}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-4}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WA_TEMPLATE_CREATED: ${WA_TEMPLATE_CREATED:-cita_confirmada}
      WA_TEMPLATE_REMINDER: ${WA_TEMPLATE_REMINDER:-recordatorio_cita}
      WA_TEMPLATE_WAITLIST: ${WA_TEMPLATE_WAITLIST:-hueco_libre}

volumes:
  pgdata:
