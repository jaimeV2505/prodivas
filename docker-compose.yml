# Despliegue local:  docker compose up --build   →  http://localhost:3100 (cambia WEB_PORT en .env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodiva
      POSTGRES_PASSWORD: prodiva
      POSTGRES_DB: prodiva
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # para `npm run dev` fuera de Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodiva -d prodiva"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://prodiva:prodiva@db:5432/prodiva
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiame}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Europe/Madrid}
      MIN_NOTICE_MIN: ${MIN_NOTICE_MIN:-120}
      MAX_DAYS_AHEAD: ${MAX_DAYS_AHEAD:-60}
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
      MAX_ACTIVE_BOOKINGS: ${MAX_ACTIVE_BOOKINGS:-6}
      CANCEL_NOTICE_HOURS: ${CANCEL_NOTICE_HOURS:-24}
      SALON_PHONE: ${SALON_PHONE:-+34 623 27 79 86}
      NEXT_PUBLIC_SALON_PHONE: ${NEXT_PUBLIC_SALON_PHONE:-+34 623 27 79 86}
      OWNER_PHONE: ${OWNER_PHONE:-}
      OWNER_SMS: ${OWNER_SMS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3100}}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-4}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WA_TEMPLATE_CREATED: ${WA_TEMPLATE_CREATED:-cita_confirmada}
      WA_TEMPLATE_REMINDER: ${WA_TEMPLATE_REMINDER:-recordatorio_cita}
      WA_TEMPLATE_WAITLIST: ${WA_TEMPLATE_WAITLIST:-hueco_libre}
      NOTIFY_TEST_PHONE: ${NOTIFY_TEST_PHONE:-+34623277986}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DEPOSIT_REFUND_HOURS: ${DEPOSIT_REFUND_HOURS:-24}
      RESCHEDULE_NOTICE_HOURS: ${RESCHEDULE_NOTICE_HOURS:-12}
      NO_SHOW_ALERT: ${NO_SHOW_ALERT:-2}
      SUMMARY_TIME: ${SUMMARY_TIME:-08:30}
      WA_TEMPLATE_TEST: ${WA_TEMPLATE_TEST:-hello_world}
      WA_TEMPLATE_TEST_LANG: ${WA_TEMPLATE_TEST_LANG:-en_US}
      PHONE_VERIFY: ${PHONE_VERIFY:-}
      DEMO_MODE: ${DEMO_MODE:-}

  # Recordatorios, recuperación de reservas, «vino» automático y limpieza: llama a la web cada minuto
  cron:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
    command:
      - node
      - -e
      - |
        const tick = () => fetch("http://web:3000/api/cron/reminders", { method: "POST", headers: { Authorization: "Bearer " + process.env.CRON_SECRET }, signal: AbortSignal.timeout(55000) }).catch(() => {});
        setTimeout(function loop() { tick().finally(() => setTimeout(loop, 60000)); }, 60000);

volumes:
  pgdata:
