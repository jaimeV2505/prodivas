name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: prodiva, POSTGRES_PASSWORD: prodiva, POSTGRES_DB: prodiva }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U prodiva" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://prodiva:prodiva@localhost:5433/prodiva
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ADMIN_PASSWORD: ci-password
      CRON_SECRET: ci-cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run build
